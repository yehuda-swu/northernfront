<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06111e">
  <meta name="description" content="Northern Front: The Security Cabinet, an interactive Explore history game about Israeli decisions and the Lebanon border.">
  <title>Northern Front | The Security Cabinet | Explore</title>
  <link rel="icon" href="assets/explore_logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene-backdrop" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Northern Front, home" id="homeLink">
      <div class="brand-logo"><img src="assets/swu_logo_white.png" alt="StandWithUs"><small>UNITED KINGDOM</small></div>
      <span class="brand-separator" aria-hidden="true"></span>
      <img class="explore-logo" src="assets/explore_logo.png" alt="Explore programme">
    </a>
    <div class="header-right">
      <span class="mission-label"><span class="live-dot"></span> EXPLORE INTERACTIVE</span>
      <button class="header-tool" id="soundToggle" type="button" aria-pressed="false" title="Toggle ambient sound">♫ <span class="sound-word">SOUND OFF</span></button>
      <button class="header-tool" id="classroomToggle" type="button" aria-pressed="false" title="Enlarge classroom text">▣ <span class="room-word">CLASSROOM</span></button>
      <a class="header-tool help-link" href="educator_guide.html" target="_blank" rel="noopener">ⓘ <span>EDUCATOR GUIDE</span></a>
    </div>
  </header>
  <main id="app" tabindex="-1" aria-live="polite" aria-atomic="false"></main>
  <footer class="site-footer">
    <span>STANDWITHUS UK · EXPLORE</span><span>HISTORICAL EDUCATION SIMULATION</span><button id="sourceFooter" type="button">SOURCES &amp; CREDITS</button>
  </footer>
  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <script src="game.js" defer></script>
</body>
</html>
